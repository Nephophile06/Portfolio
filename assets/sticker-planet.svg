<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" fill="none" class="sticker sticker-planet">
  <defs>
    <filter id="planetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="rgba(24, 40, 30, 0.2)" />
    </filter>
    <linearGradient id="planetBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="45%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>

  <g filter="url(#planetShadow)">
    <!-- White Die-Cut Vinyl Contour -->
    <path d="M 28 82 
             C 25 72, 38 68, 62 68
             C 65 40, 90 22, 120 22
             C 152 22, 178 44, 180 72
             C 198 75, 208 85, 204 96
             C 200 108, 185 112, 170 114
             C 165 138, 142 158, 115 158
             C 85 158, 62 136, 58 112
             C 40 110, 26 98, 28 82 Z" 
          fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>

    <!-- Back Half of Ring -->
    <ellipse cx="115" cy="90" rx="90" ry="24" fill="none" stroke="url(#ringGrad)" stroke-width="12" transform="rotate(-18 115 90)" opacity="0.7"/>

    <!-- Planet Main Body -->
    <circle cx="115" cy="90" r="54" fill="url(#planetBodyGrad)" stroke="#475569" stroke-width="2.5"/>

    <!-- Surface Bands / Texture -->
    <path d="M 68 82 C 90 92, 140 92, 162 82" stroke="#fef08a" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 72 102 C 95 112, 138 112, 158 102" stroke="#fb7185" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    <circle cx="95" cy="65" r="4" fill="#ffffff" opacity="0.5"/>
    <circle cx="106" cy="60" r="2.5" fill="#ffffff" opacity="0.4"/>
    <circle cx="135" cy="118" r="5" fill="#881337" opacity="0.35"/>

    <!-- Front Half of Ring -->
    <path d="M 32 106 C 55 125, 175 95, 198 74" fill="none" stroke="url(#ringGrad)" stroke-width="13" stroke-linecap="round"/>
    <path d="M 40 108 C 62 124, 170 96, 190 76" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

    <!-- Floating Little Moon & Sparkles -->
    <circle cx="42" cy="42" r="7" fill="#fef08a" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="2" fill="#ffffff"/>
    <!-- 4-point sparkle -->
    <polygon points="188,38 190,44 196,46 190,48 188,54 186,48 180,46 186,44" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
  </g>
</svg>
