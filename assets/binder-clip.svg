<svg width="74" height="78" viewBox="0 0 74 78" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Stealth Black / Anodized Black Wire Gradients with Crisp Metallic Rim Sheen -->
        <linearGradient id="blackWireFront" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#181a1d" />
            <stop offset="22%" stop-color="#7a7f8a" />
            <stop offset="42%" stop-color="#2c2e33" />
            <stop offset="68%" stop-color="#141517" />
            <stop offset="85%" stop-color="#555963" />
            <stop offset="100%" stop-color="#16181a" />
        </linearGradient>

        <linearGradient id="blackWireBack" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#101113" />
            <stop offset="30%" stop-color="#555861" />
            <stop offset="60%" stop-color="#222428" />
            <stop offset="85%" stop-color="#3d4047" />
            <stop offset="100%" stop-color="#0e0f11" />
        </linearGradient>

        <!-- Black clip body gradient with realistic industrial satin sheen -->
        <linearGradient id="blackBody" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#36383c" />
            <stop offset="10%" stop-color="#222326" />
            <stop offset="48%" stop-color="#151618" />
            <stop offset="85%" stop-color="#0f1012" />
            <stop offset="100%" stop-color="#070708" />
        </linearGradient>

        <linearGradient id="metalHinge" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#42454b" />
            <stop offset="45%" stop-color="#232427" />
            <stop offset="75%" stop-color="#131416" />
            <stop offset="100%" stop-color="#2b2d31" />
        </linearGradient>

        <filter id="binderClipShadow" x="-25%" y="-18%" width="150%" height="140%">
            <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="rgba(18, 48, 36, 0.40)" />
        </filter>
    </defs>

    <g filter="url(#binderClipShadow)">
        <!-- 1. Back wire handle loop (slender / chikon profile) -->
        <path d="M 26 56 
                 L 26.5 38 
                 C 26.5 28 21.5 19 23.5 12 
                 C 25 5 29.5 3.5 37 3.5 
                 C 44.5 3.5 49 5 50.5 12 
                 C 52.5 19 47.5 28 47.5 38 
                 L 48 56" 
              stroke="url(#blackWireBack)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />

        <!-- 2. Main Black Binder Clip Body (triangular foldback clamp) -->
        <rect x="8" y="38" width="58" height="34" rx="3" fill="url(#blackBody)" />
        
        <!-- Top bevel reflection line -->
        <line x1="10" y1="39.2" x2="64" y2="39.2" stroke="#60646d" stroke-width="0.85" opacity="0.75" />
        <!-- Subtle vertical highlight on left side -->
        <line x1="9" y1="41" x2="9" y2="70" stroke="#36383e" stroke-width="0.8" opacity="0.4" />

        <!-- 3. Bottom rolled barrel hinges (left and right) -->
        <rect x="8" y="64" width="16" height="8" rx="2.5" fill="url(#metalHinge)" />
        <rect x="50" y="64" width="16" height="8" rx="2.5" fill="url(#metalHinge)" />
        <!-- Center bottom cutout / lip -->
        <rect x="27" y="67" width="20" height="5" rx="1.5" fill="#0b0c0d" />

        <!-- 4. Front wire handle loop (slender / chikon bent steel wire) -->
        <path d="M 23.5 67 
                 L 24 38 
                 C 24 26 19 17 21.5 10 
                 C 24 3 29 1.2 37 1.2 
                 C 45 1.2 50 3 52.5 10 
                 C 55 17 50 26 50 38 
                 L 50.5 67" 
              stroke="url(#blackWireFront)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none" />

        <!-- 5. Black hinge pins clamping into the bottom rolled barrels -->
        <circle cx="23.5" cy="67.5" r="1.8" fill="#32353a" stroke="#161719" stroke-width="0.5" />
        <circle cx="50.5" cy="67.5" r="1.8" fill="#32353a" stroke="#161719" stroke-width="0.5" />
    </g>
</svg>