<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none" class="sticker sticker-astronaut">
  <defs>
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="rgba(24, 40, 30, 0.22)" />
    </filter>
    <linearGradient id="astroVisor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="astroGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="astroSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <g filter="url(#stickerShadow)">
    <!-- White Die-Cut Vinyl Sticker Border (Thick outline) -->
    <path d="M 65 42 
             C 65 18, 135 18, 135 42
             C 152 45, 162 62, 162 80
             C 162 95, 150 110, 140 115
             C 152 125, 168 145, 172 175
             C 175 195, 155 205, 142 195
             C 135 215, 115 225, 100 225
             C 85 225, 65 215, 58 195
             C 45 205, 25 195, 28 175
             C 32 145, 48 125, 60 115
             C 50 110, 38 95, 38 80
             C 38 62, 48 45, 65 42 Z" 
          fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Backpack / Life Support -->
    <rect x="52" y="70" width="96" height="90" rx="20" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3"/>
    <rect x="62" y="76" width="76" height="30" rx="8" fill="#94a3b8" opacity="0.4"/>

    <!-- Cute Body / Suit -->
    <path d="M 68 110 
             C 68 100, 132 100, 132 110 
             L 142 170 
             C 142 188, 118 192, 100 192 
             C 82 192, 58 188, 58 170 Z" 
          fill="url(#astroSuit)" stroke="#64748b" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Suit Chest Panel -->
    <rect x="80" y="125" width="40" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="90" cy="136" r="4" fill="#ef4444"/>
    <circle cx="102" cy="136" r="4" fill="#3b82f6"/>
    <circle cx="114" cy="136" r="3" fill="#10b981"/>
    <line x1="88" y1="147" x2="112" y2="147" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Legs & Cute Boots -->
    <path d="M 75 185 L 72 210 C 72 218, 92 218, 92 210 L 90 185 Z" fill="url(#astroSuit)" stroke="#64748b" stroke-width="3"/>
    <path d="M 110 185 L 108 210 C 108 218, 128 218, 128 210 L 125 185 Z" fill="url(#astroSuit)" stroke="#64748b" stroke-width="3"/>
    <!-- Boot soles -->
    <path d="M 70 210 C 70 216, 94 216, 94 210 Z" fill="#64748b"/>
    <path d="M 106 210 C 106 216, 130 216, 130 210 Z" fill="#64748b"/>

    <!-- Left Arm (Waving) -->
    <path d="M 65 116 
             C 45 125, 32 140, 36 160 
             C 38 168, 48 170, 52 162 
             C 56 150, 66 138, 74 132 Z" 
          fill="url(#astroSuit)" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- Glove Left -->
    <circle cx="38" cy="164" r="10" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>

    <!-- Right Arm (Floating up / waving to stars) -->
    <path d="M 135 116 
             C 155 110, 165 95, 162 78 
             C 160 70, 150 72, 148 80 
             C 144 92, 136 104, 126 112 Z" 
          fill="url(#astroSuit)" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- Glove Right -->
    <circle cx="160" cy="74" r="10" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <!-- Tiny star in hand -->
    <polygon points="160,54 163,62 171,63 165,69 167,77 160,72 153,77 155,69 149,63 157,62" fill="url(#astroGold)" stroke="#d97706" stroke-width="1"/>

    <!-- Cute Big Round Helmet -->
    <circle cx="100" cy="65" r="46" fill="url(#astroSuit)" stroke="#64748b" stroke-width="3.5"/>
    <circle cx="100" cy="65" r="38" fill="url(#astroVisor)" stroke="#334155" stroke-width="2.5"/>

    <!-- Visor Reflection & Sparkle -->
    <ellipse cx="108" cy="56" rx="22" ry="14" fill="#60a5fa" opacity="0.45" transform="rotate(-15 108 56)"/>
    <ellipse cx="112" cy="52" rx="10" ry="5" fill="#ffffff" opacity="0.75" transform="rotate(-15 112 52)"/>
    <circle cx="86" cy="74" r="2.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="120" cy="72" r="1.8" fill="#38bdf8" opacity="0.9"/>

    <!-- Cute Helmet Antenna -->
    <line x1="100" y1="19" x2="100" y2="8" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="100" cy="6" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
  </g>
</svg>
