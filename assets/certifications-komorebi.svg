<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%" preserveAspectRatio="xMinYMin meet"><defs>
    <filter id="bokehCanopyBlur" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="40" />
    </filter>

    <filter id="bokehMidBlur" x="-25%" y="-25%" width="150%" height="150%">
